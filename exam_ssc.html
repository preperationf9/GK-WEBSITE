<!doctype html>
<html>
<head>
  <title>SSC Exam - GK Preparation Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ✅ Main Branding Header (Same as IB) -->
<header class="main-header">
  <div class="brand-title">📘 GK Preparation Hub</div>
  <div class="tagline">Smart Preparation for Serious Aspirants 🚀</div>
</header>

<h1 class="page-title">📘 SSC Exam Preparation</h1>

<div id="examContent" class="section-grid"></div>

<button class="back-btn" onclick="goBack()">⬅ Back</button>

<script>

let level = "home";

function loadHome(){
  level = "home";

  document.getElementById("examContent").innerHTML = `
    ${card("cgl","SSC CGL")}
    ${card("chsl","SSC CHSL")}
    ${card("gd","SSC GD")}
    ${card("cpo","SSC CPO")}
  `;
}

function card(type,title){
  return `
    <div class="section-card">
      <h3>${title}</h3>
      <button class="glow-btn" onclick="openContent('${type}')">Open</button>
    </div>
  `;
}

function openContent(type){
  level = "content";

  let questions = [];

  if(type === "cgl"){
    questions = [
      "What is Indian Constitution?",
      "Explain Fundamental Rights.",
      "What is GDP?",
      "Explain Indian Parliament."
    ];
  }

  if(type === "chsl"){
    questions = [
      "Define Percentage.",
      "Explain Ratio & Proportion.",
      "What is Tense in English?",
      "Explain Active & Passive Voice."
    ];
  }

  if(type === "gd"){
    questions = [
      "What is Indian Army Structure?",
      "Explain Internal Security.",
      "What is Discipline?",
      "Role of CAPF?"
    ];
  }

  if(type === "cpo"){
    questions = [
      "Explain IPC.",
      "What is CrPC?",
      "Define Cyber Crime.",
      "What is Law & Order?"
    ];
  }

  let contentHTML = `
    <h2>Question Bank</h2>
  `;

  questions.forEach(q=>{
    contentHTML += `
      <div class="qa-box">
        <div class="question">${q}</div>
        <div class="answer">Demo answer for testing purpose.</div>
      </div>
    `;
  });

  document.getElementById("examContent").innerHTML = contentHTML;
}

function goBack(){
  if(level === "content"){
    loadHome();
  } else {
    window.location.href = "exams.html";
  }
}

loadHome();

</script>

<script src="darkmode.js"></script>

</body>
</html>
