<!doctype html>
<html>
<head>
  <title>Result</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="center">

<button class="dark-toggle" onclick="toggleDarkMode()">🌙 Dark</button>

<div class="card">
  <h2>🎉 Your Result</h2>
  <p id="resultText"></p>
  <button onclick="location.href='dashboard.html'">Back</button>
</div>

<script>
let s = localStorage.getItem("score"),
    t = localStorage.getItem("total");
document.getElementById("resultText").innerText = `Score: ${s}/${t}`;
</script>

<script src="darkmode.js"></script>
</body>
</html>
