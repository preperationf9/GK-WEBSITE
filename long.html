<!doctype html>
<html>
<head>
  <title>Long Questions</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<button class="dark-toggle" onclick="toggleDarkMode()">🌙 Dark</button>

<header>📝 Long Answer Questions</header>

<div id="contentArea" class="section-grid"></div>

<button class="back-btn" onclick="handleBack()">⬅ Back</button>

<script>

const content = document.getElementById("contentArea");

let currentLevel = "year"; // year → month → question
let selectedYear = "";
let selectedMonth = "";


// ------------------ SHOW YEARS ------------------
function showYears(){
  currentLevel = "year";
  content.innerHTML = `
    ${yearCard(2024)}
    ${yearCard(2025)}
    ${yearCard(2026)}
  `;
}

function yearCard(year){
  return `
    <div class="section-card" onclick="showMonths(${year})">
      🗓️ ${year}
    </div>
  `;
}


// ------------------ SHOW MONTHS ------------------
function showMonths(year){
  currentLevel = "month";
  selectedYear = year;

  const months = ["January","February","March","April","May","June",
                  "July","August","September","October","November","December"];

  content.innerHTML = months.map(m =>
    `<div class="section-card" onclick="showQuestions('${m}')">${m}</div>`
  ).join("");
}


// ------------------ SHOW QUESTIONS ------------------
function showQuestions(month){
  currentLevel = "question";
  selectedMonth = month;

  content.innerHTML = `
    <h2>${month} ${selectedYear} Long Questions</h2>

    ${questionBox("Explain India’s foreign policy developments.")}
    ${questionBox("Discuss India-Maldives diplomatic relations.")}
    ${questionBox("Explain impact of AI in competitive exams.")}
    ${questionBox("Describe India’s economic reforms.")}
    ${questionBox("Explain Cyber Security challenges in India.")}
  `;
}

function questionBox(q){
  return `
    <div class="qa-box">
      <div class="question">${q}</div>
      <div class="answer">
        This is a demo answer to test the button functionality.
        You can replace it with your real long answer content.
      </div>
    </div>
  `;
}


// ------------------ BACK BUTTON LOGIC ------------------
function handleBack(){

  if(currentLevel === "question"){
    showMonths(selectedYear);
  }
  else if(currentLevel === "month"){
    showYears();
  }
  else{
    window.location.href = "dashboard.html";
  }

}


// INITIAL LOAD
showYears();

</script>

<script src="darkmode.js"></script>

</body>
</html>
