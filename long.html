<!doctype html>
<html>
<head>
  <title>Long Answer Questions - GK Preparation Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ✅ Main Branding Header -->
<header class="main-header">
  <div class="brand-title">📘 GK Preparation Hub</div>
  <div class="tagline">Smart Preparation for Serious Aspirants 🚀</div>
</header>

<button class="dark-toggle" onclick="toggleDarkMode()">🌙 Dark</button>

<h1 class="page-title">📝 Long Answer Questions</h1>

<div id="contentArea" class="section-grid"></div>

<button class="back-btn" onclick="handleBack()">⬅ Back</button>

<script>

let currentLevel = "year";
let selectedYear = "";

const content = document.getElementById("contentArea");

function showYears(){
  currentLevel = "year";
  content.innerHTML = `
    <div class="section-card" onclick="showMonths(2024)">🗓️ 2024</div>
    <div class="section-card" onclick="showMonths(2025)">🗓️ 2025</div>
    <div class="section-card" onclick="showMonths(2026)">🗓️ 2026</div>
  `;
}

function showMonths(year){
  currentLevel = "month";
  selectedYear = year;

  const months = ["January","February","March","April","May","June",
                  "July","August","September","October","November","December"];

  content.innerHTML = months.map(m =>
    `<div class="section-card" onclick="showQuestions('${m}')">${m}</div>`
  ).join("");
}

function showQuestions(month){
  currentLevel = "question";

  content.innerHTML = `
    <h2>${month} ${selectedYear}</h2>
    ${qa("Explain India’s foreign policy developments.")}
    ${qa("Discuss India-Maldives relations.")}
    ${qa("Impact of AI in competitive exams.")}
    ${qa("India economic reforms overview.")}
    ${qa("Cyber Security challenges in India.")}
  `;
}

function qa(q){
  return `
    <div class="qa-box">
      <div class="question">${q}</div>
      <div class="answer">Demo answer for testing purpose.</div>
    </div>
  `;
}

function handleBack(){
  if(currentLevel === "question"){
    showMonths(selectedYear);
  }
  else if(currentLevel === "month"){
    showYears();
  }
  else{
    window.location.href = "dashboard.html";
  }
}

showYears();

</script>

<script src="darkmode.js"></script>

</body>
</html>
