<!doctype html>
<html>
<head>
  <title>IB Exam Preparation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<button class="dark-toggle" onclick="toggleDarkMode()">🌙 Dark</button>

<header>🕵️ IB Exam Preparation</header>

<div class="section-grid">
  <div class="section-card" onclick="openExam('ACIO')">ACIO</div>
  <div class="section-card" onclick="openExam('MTS')">MTS</div>
  <div class="section-card" onclick="openExam('Security Assistant')">Security Assistant</div>
</div>

<div id="examContent" class="section-grid"></div>

<button class="back-btn" onclick="location.href='exams.html'">⬅ Back</button>

<script>

function openExam(examName){
  const box = document.getElementById("examContent");

  box.innerHTML = `
    <h2>${examName} Preparation Hub</h2>

    ${card("📅 Daily Quizzes")}
    ${card("📚 Subject-wise Notes")}
    ${card("📝 Previous Year Papers")}
    ${card("🏆 Mock Tests")}
    ${card("💡 Strategy & Syllabus")}
    ${card("🔥 Current Affairs")}
    ${card("🗣️ Vocabulary / Idioms")}
    ${card("📊 Performance Graph")}
  `;
}

function card(title){
  return `
    <div class="section-card">
      <h3>${title}</h3>
      <button class="glow-btn" onclick="openContent('${title}')">Open</button>
    </div>
  `;
}

function openContent(title){
  const box = document.getElementById("examContent");

  box.innerHTML = `
    <h2>${title}</h2>

    ${demoQ("What is Intelligence Bureau?")}
    ${demoQ("Explain IB ACIO syllabus.")}
    ${demoQ("What is the role of ACIO officer?")}
    ${demoQ("Explain Security Assistant duties.")}
    ${demoQ("Describe IB exam pattern.")}
  `;
}

function demoQ(q){
  return `
    <div class="qa-box">
      <div class="question">${q}</div>
      <div class="answer">
        This is a demo answer to test open button functionality.
      </div>
    </div>
  `;
}

</script>

<script src="darkmode.js"></script>
</body>
</html>
