<!doctype html>
<html>
<head>
  <title>IB Exam Preparation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<button class="dark-toggle" onclick="toggleDarkMode()">🌙 Dark</button>

<header>🕵️ IB Exam Preparation</header>

<div class="section-grid">
  <div class="section-card" onclick="openExam('ACIO')">ACIO</div>
  <div class="section-card" onclick="openExam('MTS')">MTS</div>
  <div class="section-card" onclick="openExam('Security Assistant')">Security Assistant</div>
</div>

<div id="examContent" class="section-grid"></div>

<button class="back-btn" onclick="goBack()">⬅ Back</button>

<script>

let level = "exam";

function openExam(name){
  level = "hub";
  const box = document.getElementById("examContent");

  box.innerHTML = `
    <h2>${name} Preparation Hub</h2>

    ${card("daily","📅 Daily Quizzes")}
    ${card("notes","📚 Subject-wise Notes")}
    ${card("pyq","📝 Previous Year Papers")}
    ${card("mock","🏆 Mock Tests")}
    ${card("strategy","💡 Strategy & Syllabus")}
    ${card("ca","🔥 Current Affairs")}
    ${card("vocab","🗣️ Vocabulary / Idioms")}
    ${card("performance","📊 Performance Graph")}
  `;
}

function card(type,title){
  return `
    <div class="section-card">
      <h3>${title}</h3>
      <button class="glow-btn" onclick="openContent('${type}')">Open</button>
    </div>
  `;
}

function openContent(type){
  level = "content";
  const box = document.getElementById("examContent");

  if(type==="daily"){
    box.innerHTML = `
      <h2>📅 Daily Quiz</h2>
      ${qa("What is IB?")}
      ${qa("Full form of ACIO?")}
      ${qa("IB established in which year?")}
      ${qa("IB works under which ministry?")}
      ${qa("IB HQ located where?")}
    `;
  }

  else if(type==="notes"){
    box.innerHTML = `
      <h2>📚 Notes</h2>
      <ul>
        <li>Reasoning Notes</li>
        <li>GS Notes</li>
        <li>English Grammar</li>
        <li>Polity Short Notes</li>
        <li>History Summary</li>
      </ul>
    `;
  }

  else if(type==="pyq"){
    box.innerHTML = `
      <h2>📝 Previous Year Questions</h2>
      ${qa("ACIO 2023 Question")}
      ${qa("ACIO 2022 Question")}
      ${qa("ACIO 2021 Question")}
      ${qa("ACIO 2020 Question")}
      ${qa("ACIO 2019 Question")}
    `;
  }

  else if(type==="mock"){
    box.innerHTML = `
      <h2>🏆 Mock Test</h2>
      <button class="glow-btn">Start Full Length Mock</button>
    `;
  }

  else if(type==="strategy"){
    box.innerHTML = `
      <h2>💡 Strategy</h2>
      <p>100 Questions | 60 Minutes</p>
      <p>Focus on Reasoning & GS</p>
      <p>Revise PYQs regularly</p>
      <p>Practice weekly mocks</p>
    `;
  }

  else if(type==="ca"){
    box.innerHTML = `
      <h2>🔥 Current Affairs</h2>
      ${qa("Recent India-Maldives update?")}
      ${qa("Latest defense exercise?")}
      ${qa("New cyber policy?")}
      ${qa("Important 2026 event?")}
      ${qa("New IB appointment?")}
    `;
  }

  else if(type==="vocab"){
    box.innerHTML = `
      <h2>🗣️ Vocabulary</h2>
      <p><b>Covert</b> – Secret</p>
      <p><b>Meticulous</b> – Very careful</p>
      <p><b>Surveillance</b> – Monitoring</p>
      <p><b>Intelligence</b> – Information gathering</p>
      <p><b>Diplomacy</b> – Managing relations</p>
    `;
  }

  else if(type==="performance"){
    box.innerHTML = `
      <h2>📊 Performance Analytics</h2>
      <p>Total Attempts: 5</p>
      <p>Average Score: 72%</p>
      <p>Highest Score: 88%</p>
      <p>Lowest Score: 60%</p>
      <p>Trend: 📈 Improving</p>
    `;
  }
}

function qa(q){
  return `
    <div class="qa-box">
      <div class="question">${q}</div>
      <div class="answer">Demo answer for testing.</div>
    </div>
  `;
}

function goBack(){
  if(level==="content"){
    document.getElementById("examContent").innerHTML="";
    level="hub";
  }
  else{
    window.location.href="exams.html";
  }
}

</script>

<script src="darkmode.js"></script>
</body>
</html>
