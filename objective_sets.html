<!doctype html>
<html>
<head>
  <title>Select Objective Set</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>📚 Select Objective Set</header>
<div class="section-grid" id="setContainer"></div>

<button class="back-btn" onclick="location.href='objective_year.html'">⬅ Back</button>

<script>
const container = document.getElementById("setContainer");

for(let i=1; i<=20; i++){
  let div = document.createElement("div");
  div.className = "section-card";
  div.innerHTML = `<h3>Set ${i}</h3>`;
  div.onclick = () => {
    localStorage.setItem("objectiveSet", i);
    location.href = "objective_questions.html"; // ✅ CORRECT PAGE
  };
  container.appendChild(div);
}
</script>

</body>
</html>
