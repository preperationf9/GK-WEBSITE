<!doctype html>
<html>
<head>
  <title>Objective Questions</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<button class="dark-toggle" onclick="toggleDarkMode()">🌙 Dark</button>

<header>📖 Objective Questions</header>
<div class="content-box" id="questionsBox"></div>

<!-- ✅ FIXED BACK BUTTON (Quiz nahi, Objective sets par jayega) -->
<button class="back-btn" onclick="location.href='objective_sets.html'">⬅ Back</button>

<script>
// 🚫 IMPORTANT: Stop Quiz Mode from triggering
localStorage.removeItem("quizSet");
localStorage.removeItem("quizMonth");
localStorage.removeItem("examQuiz");

const year = localStorage.getItem("objectiveYear");
const month = localStorage.getItem("objectiveMonth");
const set = localStorage.getItem("objectiveSet");

// LOAD OBJECTIVE SET FILE
let script = document.createElement("script");
script.src = `data/objective/${year}/${month}/set${set}.js`;
document.body.appendChild(script);

script.onload = () => {
  const box = document.getElementById("questionsBox");

  objectiveData.forEach((q, i) => {
    box.innerHTML += `
      <div class="qa-box">
        <div class="question">${i + 1}. ${q.question}</div>
        <div class="answer">Answer: ${q.options[q.answer]}</div>
      </div>
    `;
  });
};
</script>

<!-- Dark Mode Script -->
<script src="darkmode.js"></script>

</body>
</html>
