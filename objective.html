<!doctype html>
<html>
  <head>
    <title>Objective Questions</title>
    <link rel="stylesheet" href="style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <!-- 🌙 Dark Mode Button -->
    <button class="dark-toggle" onclick="toggleDarkMode()">🌙 Dark</button>

    <header>📚 Objective Questions - Select Year</header>

    <div class="section-grid">
      <div class="section-card" onclick="selectYear(2024)">📅 2024</div>
      <div class="section-card" onclick="selectYear(2025)">📅 2025</div>
      <div class="section-card" onclick="selectYear(2026)">📅 2026</div>
    </div>

    <button class="back-btn" onclick="location.href = 'dashboard.html'">
      ⬅ Back
    </button>

    <script>
      function selectYear(year) {
        localStorage.setItem("objectiveYear", year);
        location.href = "objective_year.html";
      }
    </script>

    <!-- 🌙 Global Dark Mode Script -->
    <script src="darkmode.js"></script>
  </body>
</html>
