<!doctype html>
<html>
<head>
  <title>Quiz Section - GK Preparation Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ✅ Main Branding Header -->
<header class="main-header">
  <div class="brand-title">📘 GK Preparation Hub</div>
  <div class="tagline">Smart Preparation for Serious Aspirants 🚀</div>
</header>

<button class="dark-toggle" onclick="toggleDarkMode()">🌙 Dark</button>

<h1 class="page-title">🧠 Quiz Section</h1>
<h2 class="center-text">Select Subject</h2>

<div class="section-grid">
  <div class="section-card" onclick="openSubject('current_affairs')">📰 Current Affairs</div>
  <div class="section-card" onclick="openSubject('gk')">🌍 General Awareness</div>
  <div class="section-card" onclick="openSubject('reasoning')">🧩 Reasoning</div>
</div>

<button class="back-btn" onclick="location.href = 'dashboard.html'">
  ⬅ Back
</button>

<script>
function openSubject(subject) {
  localStorage.setItem("quizSubject", subject);
  location.href = "quiz_sets.html";
}
</script>

<script src="darkmode.js"></script>

</body>
</html>
