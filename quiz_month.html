<!doctype html>
<html>
<head>
  <title>Select Month</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<header>📆 Select Month</header>

<div class="section-grid" id="months"></div>

<button class="back-btn" onclick="location.href='quiz_year.html'">⬅ Back</button>

<script>
const months = ["january","february","march","april","may","june","july","august","september","october","november","december"];
let box = document.getElementById("months");

months.forEach(m=>{
  let div = document.createElement("div");
  div.className = "section-card";
  div.innerHTML = `<h3>${m.toUpperCase()}</h3>`;
  div.onclick = ()=>{
    localStorage.setItem("quizMonth", m);
    location.href = "quiz_sets.html";
  };
  box.appendChild(div);
});
</script>

</body>
</html>
