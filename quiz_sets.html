<!doctype html>
<html>
<head>
  <title>Select Set</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<button class="dark-toggle" onclick="toggleDarkMode()">🌙 Dark</button>

<header>📚 Select Quiz Set</header>
<div class="section-grid" id="setContainer"></div>

<button class="back-btn" onclick="location.href='quiz.html'">⬅ Back</button>

<script>
const subject = localStorage.getItem("quizSubject");
const container = document.getElementById("setContainer");

for(let i=1; i<=50; i++){
  let div = document.createElement("div");
  div.className = "section-card";
  div.innerHTML = `<h3>Set ${i}</h3>`;
  div.onclick = () => {
    localStorage.setItem("quizSet", i);
    location.href = "quiz_questions.html";
  };
  container.appendChild(div);
}
</script>

<script src="darkmode.js"></script>
</body>
</html>
